alerts:
  - name: high_api_latency
    severity: critical
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: Nguyễn Huy Hưng
    runbook: docs/alerts.md#alert-1
  - name: high_api_error_rate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: Nguyễn Huy Hưng
    runbook: docs/alerts.md#alert-2
  - name: low_answer_quality
    severity: warning
    condition: quality_score_avg < 0.75 for 15m
    type: symptom-based
    owner: Nguyễn Huy Hưng
    runbook: docs/alerts.md#alert-3
